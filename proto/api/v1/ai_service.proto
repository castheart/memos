syntax = "proto3";

package memos.api.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";

option go_package = "gen/api/v1";

service AIService {
  // Transcribe transcribes an audio file using an instance AI provider.
  rpc Transcribe(TranscribeRequest) returns (TranscribeResponse) {
    option (google.api.http) = {
      post: "/api/v1/ai:transcribe"
      body: "*"
    };
    option (google.api.method_signature) = "audio";
  }

  // GenerateImage generates an image with the instance's managed image model.
  rpc GenerateImage(GenerateImageRequest) returns (GenerateImageResponse) {
    option (google.api.http) = {
      post: "/api/v1/ai:generateImage"
      body: "*"
    };
    option (google.api.method_signature) = "prompt";
  }
}

message TranscribeRequest {
  // Required. Audio input.
  TranscriptionAudio audio = 1 [(google.api.field_behavior) = REQUIRED];
}

message TranscriptionAudio {
  oneof source {
    // Inline audio bytes.
    bytes content = 1 [(google.api.field_behavior) = INPUT_ONLY];

    // URI for audio content. Reserved for future use.
    string uri = 2;
  }

  // Optional. The uploaded filename.
  string filename = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The MIME type of the input audio.
  string content_type = 4 [(google.api.field_behavior) = OPTIONAL];
}

message TranscribeResponse {
  // The transcribed text.
  string text = 1;
}

message GenerateImageRequest {
  // Required. Natural-language description of the image to generate.
  string prompt = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. Output aspect ratio. Supported values: 1:1, 4:3, 3:4, 16:9, 9:16.
  string aspect_ratio = 2 [(google.api.field_behavior) = OPTIONAL];
}

message GenerateImageResponse {
  // Generated image bytes.
  bytes content = 1;

  // MIME type of the generated image.
  string content_type = 2;

  // Suggested filename for attaching the image to a memo.
  string filename = 3;

  // Exact Anyhost Catalog model ID that generated the image.
  string model = 4;

  // Anyhost Generation ID for usage and settlement lookup.
  string generation_id = 5;

  // Settlement state returned by Anyhost.
  string settlement_status = 6;

  // Final USD cost. Populated only when settlement_status is "settled".
  string cost = 7;

  // Final Model Credit debit. Populated only when settlement_status is "settled".
  string credits = 8;
}
